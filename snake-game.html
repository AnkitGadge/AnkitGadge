<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake Game</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, sans-serif;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #10171f;
      color: #e8f0ff;
    }
    .game-wrap {
      text-align: center;
    }
    canvas {
      border: 3px solid #9de17a;
      background: #0c1117;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }
    .hud {
      margin-top: 14px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 1rem;
    }
    .hint {
      margin-top: 10px;
      opacity: 0.8;
      font-size: 0.9rem;
    }
    button {
      margin-top: 14px;
      border: 0;
      border-radius: 8px;
      padding: 8px 14px;
      font-weight: 700;
      background: #9de17a;
      color: #15230d;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="game-wrap">
    <h1>Snake Game</h1>
    <canvas id="board" width="400" height="400" aria-label="Snake board"></canvas>
    <div class="hud">
      <span>Score: <strong id="score">0</strong></span>
      <span>Best: <strong id="best">0</strong></span>
    </div>
    <button id="restart" type="button">Restart</button>
    <div class="hint">Use Arrow keys or WASD to move.</div>
  </main>

  <script>
    const canvas = document.getElementById('board');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const restartBtn = document.getElementById('restart');

    const gridSize = 20;
    const tileCount = canvas.width / gridSize;
    const speed = 110;

    let snake;
    let direction;
    let queuedDirection;
    let food;
    let score;
    let best = Number(localStorage.getItem('snake-best') || 0);
    let gameOver;
    let loopId;

    bestEl.textContent = String(best);

    function resetGame() {
      snake = [{ x: 10, y: 10 }];
      direction = { x: 1, y: 0 };
      queuedDirection = { ...direction };
      score = 0;
      scoreEl.textContent = '0';
      gameOver = false;
      spawnFood();
      clearInterval(loopId);
      loopId = setInterval(tick, speed);
      draw();
    }

    function spawnFood() {
      while (true) {
        const candidate = {
          x: Math.floor(Math.random() * tileCount),
          y: Math.floor(Math.random() * tileCount),
        };
        const onSnake = snake.some(segment => segment.x === candidate.x && segment.y === candidate.y);
        if (!onSnake) {
          food = candidate;
          return;
        }
      }
    }

    function setDirection(x, y) {
      if (direction.x + x === 0 && direction.y + y === 0) {
        return;
      }
      queuedDirection = { x, y };
    }

    document.addEventListener('keydown', (event) => {
      const key = event.key.toLowerCase();
      if (key === 'arrowup' || key === 'w') setDirection(0, -1);
      if (key === 'arrowdown' || key === 's') setDirection(0, 1);
      if (key === 'arrowleft' || key === 'a') setDirection(-1, 0);
      if (key === 'arrowright' || key === 'd') setDirection(1, 0);
      if (gameOver && key === ' ') resetGame();
    });

    restartBtn.addEventListener('click', resetGame);

    function tick() {
      if (gameOver) {
        return;
      }

      direction = queuedDirection;
      const head = {
        x: snake[0].x + direction.x,
        y: snake[0].y + direction.y,
      };

      if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        finishGame();
        return;
      }

      const hitSelf = snake.some(segment => segment.x === head.x && segment.y === head.y);
      if (hitSelf) {
        finishGame();
        return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 1;
        scoreEl.textContent = String(score);
        if (score > best) {
          best = score;
          localStorage.setItem('snake-best', String(best));
          bestEl.textContent = String(best);
        }
        spawnFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function finishGame() {
      gameOver = true;
      draw();
      ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 30px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2 - 10);
      ctx.font = '16px Arial';
      ctx.fillText('Press restart or spacebar', canvas.width / 2, canvas.height / 2 + 22);
    }

    function draw() {
      ctx.fillStyle = '#0c1117';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#ff6f61';
      ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);

      snake.forEach((segment, index) => {
        ctx.fillStyle = index === 0 ? '#9de17a' : '#73c255';
        ctx.fillRect(segment.x * gridSize, segment.y * gridSize, gridSize - 2, gridSize - 2);
      });

      ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
      for (let i = 0; i <= tileCount; i++) {
        ctx.beginPath();
        ctx.moveTo(i * gridSize, 0);
        ctx.lineTo(i * gridSize, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, i * gridSize);
        ctx.lineTo(canvas.width, i * gridSize);
        ctx.stroke();
      }
    }

    resetGame();
  </script>
</body>
</html>
